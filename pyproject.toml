[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ngtagger"
version = "0.1.0"
description = "NG jet tagger training from L1PFTrkNano"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ngtagger = "ngtagger.cli:main"
