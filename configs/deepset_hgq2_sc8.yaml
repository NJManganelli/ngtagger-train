# SC8 (wide-cone) NG tagger training — same DeepSet HGQ2 architecture as the
# SC4 baseline, pointed at the SC8 jet/link tables via the data_config table
# knobs (the pipeline is table-name parametrized; no code fork).
#
# PRODUCTION-SIDE STATUS (2026-07-19, updated by SC8 nano-extension work):
# The cmssw side now emits the PLAIN SC8 jet + jet<->constituent link tables
# (no NG-tagged SC8 collection is needed for training: labels come from gen
# matching in-pipeline; the "NG SC8" collection only exists after a model is
# deployed via the future cloned tagger). Table names below are the PLAIN-SC8
# pattern (mirror of L1SC4JetCands, NOT the NG L1SC4NGJetCands):
#   jet_table  L1puppiJetSC8    kinematic SC8 SeededCone jets (pt/eta/phi/et/mass)
#   link_table L1SC8JetCands    jetIdx / candIdx / slot / inTagger
#   cand_table L1PuppiCand      deregionized (plain) Puppi candidates
#   track_table L1TTrack        plain tracklet tracks (crossref via l1TrackIdx)
# These require the L1PFNano flavor to re-emulate the deregionizer + SC8
# SeededCone jets in-job (see L1Trigger/Phase3SmartPixels/doc/ProcurementKeeps.md
# and DPGAnalysis/Phase3SmartPixelsNanoAOD reemulateJetSideForPFTier).
model: DeepSetHGQ2
experiment: ngtagger-sc8

run_config:
  verbose: 2

data_config:
  # SC8 cones hold more constituents; 32 matches the wider clustering window.
  # Revisit against the actual SC8 firmware tagger window when it exists.
  n_constituents: 32
  feature_groups: [baseline]
  jet_table: L1puppiJetSC8
  link_table: L1SC8JetCands
  cand_table: L1PuppiCand
  track_table: L1TTrack
  cluster_table: L1HGCCluster
  # gen matching follows the jet radius (0.8 for SC8; 0.4 default for SC4)
  gen_match_dr: 0.8

model_config:
  name: deepset_hgq2_sc8
  conv1d_layers: [10, 10]
  conv1d_parallelisation_factor: [32, 32]
  classification_layers: [32, 16]
  regression_layers: [10]
  beta: 1.0e-8

quantization_config:
  pt_output_quantization: [16, 6]

training_config:
  weight_method: onlyclass
  validation_split: 0.1
  epochs: 150
  batch_size: 2048
  learning_rate: 0.01
  loss_weights: [1.0, 1.0]
  EarlyStopping_patience: 15
  ReduceLROnPlateau_factor: 0.5
  ReduceLROnPlateau_patience: 5
  ReduceLROnPlateau_min_lr: 1.0e-5

firmware_config:
  backend: Vitis
  clock_period: 2.5
  fpga_part: xcvu13p-flga2577-2-e
  project_name: L1TSC8NGJetModel_ngt
