# MDMM-constrained variant of deepset_hgq2.yaml (model-space study B.2.2/B.2.3):
# charge head enabled, fixed loss weights partially replaced by physical
# constraints. See docs/constrained-training.md for the schema.
model: DeepSetHGQ2
experiment: ngtagger

run_config:
  verbose: 2

data_config:
  n_constituents: 16
  feature_groups: [baseline]

model_config:
  name: deepset_hgq2_mdmm
  conv1d_layers: [10, 10]
  conv1d_parallelisation_factor: [16, 16]
  classification_layers: [32, 16]
  regression_layers: [10]
  # 3-class charge head {q-, neutral/gluon, q+} sharing the pooled trunk
  charge_layers: [8]
  beta: 1.0e-8

quantization_config:
  pt_output_quantization: [16, 6]

training_config:
  weight_method: onlyclass
  validation_split: 0.1
  epochs: 150
  batch_size: 2048
  learning_rate: 0.01
  # [jet_id, pT, charge]; charge weight 0: the head is driven purely by its
  # head_loss ceiling below (the study's "floor constraint instead of a
  # weighted sum")
  loss_weights: [1.0, 1.0, 0.0]
  EarlyStopping_patience: 15
  ReduceLROnPlateau_factor: 0.5
  ReduceLROnPlateau_patience: 5
  ReduceLROnPlateau_min_lr: 1.0e-5

constraints:
  damping: 1.0
  items:
    # pt-regression response bias held below 1% (per-batch proxy, mdmm.py)
    - target: pt_bias
      type: max
      value: 0.01
    # charge-head CE ceiling so the new head cannot degrade the main tagger
    - target: head_loss
      head: charge_output
      loss: categorical_crossentropy
      type: max
      value: 0.95
    # EBOPs budget constraint (flagship; replaces the static beta above --
    # enable once a budget is chosen; see EBOPsConstraint in train/mdmm.py):
    # - target: ebops
    #   value: 20000        # budget in EBOPs
    #   lambda_lr: 1.0e-6
    #   damping: 0.0

firmware_config:
  backend: Vitis
  clock_period: 2.5
  fpga_part: xcvu13p-flga2577-2-e
  project_name: L1TSC4NGJetModel_ngt_mdmm
